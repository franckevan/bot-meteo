name: Bot Météo Bluesky

# When the bot runs
on:
  schedule:
    # ⚠️ Times are in UTC. Paris = UTC+2 (summer) / UTC+1 (winter)
    # 06:00 UTC = 08:00 Paris (summer)   |   16:00 UTC = 18:00 Paris (summer)
    - cron: '0 6 * * *'
    - cron: '0 16 * * *'
  # Also allows running the bot manually from GitHub ("Run workflow" button)
  workflow_dispatch:

jobs:
  poster-meteo:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the code
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install the libraries
      - name: Installer les dépendances
        run: npm install

      # 4. Run the bot (secrets come from GitHub Secrets)
      - name: Publier la météo
        run: node bot.js
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}